<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="punta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a3a37"/></marker></defs><style>text{white-space:pre}</style><rect width="1200" height="800" fill="#ffffff"/><text x="600" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1d1d1b">Arquitectura híbrida del subsistema de hospitalización (Grupo 6)</text><text x="40" y="62" font-size="12" font-weight="700" fill="#52514e">FUENTES DE EVENTOS MASIVOS (semiestructurados)</text><rect x="40" y="72" width="130" height="58" rx="8" fill="#f4faf7" stroke="#1baf7a" stroke-width="1.5"/><text x="105" y="96" text-anchor="middle" font-size="12" font-weight="600" fill="#1d1d1b">Monitores</text><text x="105" y="113" text-anchor="middle" font-size="11" fill="#52514e">multiparámetro</text><rect x="185" y="72" width="130" height="58" rx="8" fill="#f4faf7" stroke="#1baf7a" stroke-width="1.5"/><text x="250" y="96" text-anchor="middle" font-size="12" font-weight="600" fill="#1d1d1b">Pulseras</text><text x="250" y="113" text-anchor="middle" font-size="11" fill="#52514e">wearables</text><rect x="330" y="72" width="130" height="58" rx="8" fill="#f4faf7" stroke="#1baf7a" stroke-width="1.5"/><text x="395" y="96" text-anchor="middle" font-size="12" font-weight="600" fill="#1d1d1b">Bombas de</text><text x="395" y="113" text-anchor="middle" font-size="11" fill="#52514e">infusión</text><rect x="475" y="72" width="130" height="58" rx="8" fill="#f4faf7" stroke="#1baf7a" stroke-width="1.5"/><text x="540" y="96" text-anchor="middle" font-size="12" font-weight="600" fill="#1d1d1b">Glucómetros</text><text x="540" y="113" text-anchor="middle" font-size="11" fill="#52514e">de cabecera</text><rect x="620" y="72" width="130" height="58" rx="8" fill="#f4faf7" stroke="#1baf7a" stroke-width="1.5"/><text x="685" y="96" text-anchor="middle" font-size="12" font-weight="600" fill="#1d1d1b">Teleconsultas</text><text x="685" y="113" text-anchor="middle" font-size="11" fill="#52514e">post-alta (logs)</text><path d="M105,130 L105,150 L685,150 L685,130" fill="none" stroke="#3a3a37" stroke-width="1.5"/><path d="M185,150 L185,208" fill="none" stroke="#3a3a37" stroke-width="2" marker-end="url(#punta)"/><text x="195" y="176" font-size="11" fill="#1d1d1b" text-anchor="start">JSON con campos</text><text x="195" y="190" font-size="11" fill="#1d1d1b" text-anchor="start">variables</text><text x="880" y="62" font-size="12" font-weight="700" fill="#52514e">OPERACIÓN CRÍTICA DE NEGOCIO</text><rect x="860" y="72" width="300" height="58" rx="10" fill="#fdf3ee" stroke="#eb6834" stroke-width="2"/><text x="1010.0" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#1d1d1b">Admisiones / HIS</text><text x="1010.0" y="116" text-anchor="middle" font-size="11" fill="#52514e">admitir, dar de alta, asignar cama y equipos</text><path d="M1010,130 L1010,208" fill="none" stroke="#3a3a37" stroke-width="2" marker-end="url(#punta)"/><rect x="40" y="210" width="300" height="92" rx="10" fill="#f7f7f5" stroke="#3a3a37" stroke-width="2"/><text x="190.0" y="234" text-anchor="middle" font-size="13" font-weight="700" fill="#1d1d1b">Servicio de ingesta</text><text x="190.0" y="254" text-anchor="middle" font-size="11" fill="#52514e">scripts/01_simular_ingesta.py</text><text x="190.0" y="270" text-anchor="middle" font-size="11" fill="#52514e">masivo: 200.000 eventos | continuo: 500 ev/s</text><rect x="400" y="210" width="300" height="92" rx="10" fill="#f7f7f5" stroke="#3a3a37" stroke-width="2"/><text x="550.0" y="234" text-anchor="middle" font-size="13" font-weight="700" fill="#1d1d1b">Tablero clínico (integración)</text><text x="550.0" y="254" text-anchor="middle" font-size="11" fill="#52514e">scripts/04_consulta_hibrida.py</text><text x="550.0" y="270" text-anchor="middle" font-size="11" fill="#52514e">une alertas (BASE) + identidad (ACID)</text><rect x="860" y="210" width="300" height="92" rx="10" fill="#fdf3ee" stroke="#eb6834" stroke-width="2"/><text x="1010.0" y="234" text-anchor="middle" font-size="13" font-weight="700" fill="#1d1d1b">Procedimientos transaccionales</text><text x="1010.0" y="254" text-anchor="middle" font-size="11" fill="#52514e">CALL core.sp_admitir_paciente(...)</text><text x="1010.0" y="270" text-anchor="middle" font-size="11" fill="#52514e">CALL core.sp_dar_alta(...)</text><path d="M290,210 L290,197 L780,197 L780,388" fill="none" stroke="#3a3a37" stroke-width="2" marker-end="url(#punta)"/><text x="470" y="168" font-size="11" fill="#1d1d1b" text-anchor="start">① ¿De quién es este dispositivo?</text><text x="470" y="182" font-size="11" fill="#1d1d1b" text-anchor="start">SELECT core.asignaciones_dispositivo</text><path d="M150,302 L150,388" fill="none" stroke="#3a3a37" stroke-width="2" marker-end="url(#punta)"/><text x="160" y="335" font-size="11" fill="#1d1d1b" text-anchor="start">② insert_many</text><text x="160" y="349" font-size="11" fill="#1d1d1b" text-anchor="start">lotes de 1.000, w:1</text><path d="M470,302 L470,388" fill="none" stroke="#3a3a37" stroke-width="2" marker-end="url(#punta)"/><text x="462" y="335" font-size="11" fill="#1d1d1b" text-anchor="end">③ alertas críticas</text><text x="462" y="349" font-size="11" fill="#1d1d1b" text-anchor="end">por ts (índice multikey)</text><path d="M660,302 L660,388" fill="none" stroke="#3a3a37" stroke-width="2" marker-end="url(#punta)"/><text x="652" y="335" font-size="11" fill="#1d1d1b" text-anchor="end">④ nombre, cama, médico</text><text x="652" y="349" font-size="11" fill="#1d1d1b" text-anchor="end">WHERE paciente_id = ANY(...)</text><path d="M1010,302 L1010,388" fill="none" stroke="#3a3a37" stroke-width="2" marker-end="url(#punta)"/><text x="1020" y="335" font-size="11" fill="#1d1d1b" text-anchor="start">⑤ transacción ACID</text><text x="1020" y="349" font-size="11" fill="#1d1d1b" text-anchor="start">todo o nada</text><rect x="40" y="390" width="520" height="330" rx="12" fill="#f4faf7" stroke="#1baf7a" stroke-width="2.5"/><text x="60" y="418" font-size="15" font-weight="700" fill="#1d1d1b">MongoDB 9 · capa BASE</text><text x="60" y="436" font-size="11.5" fill="#52514e">BD hce_telemetria_grupo_6 · AP en CAP · consistencia eventual</text><text x="60" y="464" font-size="11.5" fill="#1d1d1b"><tspan font-weight='700'>eventos_telemetria</tspan>  200.000 lecturas, 4 tipos de equipo</text><text x="60" y="481" font-size="11.5" fill="#1d1d1b"><tspan font-weight='700'>eventos_telemetria_ts</tspan>  time series (metaField: origen)</text><text x="60" y="498" font-size="11.5" fill="#1d1d1b"><tspan font-weight='700'>sesiones_teleconsulta</tspan>  400 sesiones con logs anidados</text><text x="60" y="530" font-size="11.5" fill="#1d1d1b">• Esquema flexible: cada documento trae sus campos</text><text x="60" y="549" font-size="11.5" fill="#1d1d1b">• Validador $jsonSchema solo para lo mínimo</text><text x="60" y="568" font-size="11.5" fill="#1d1d1b">  (paciente_id, dispositivo_id, ts, lecturas)</text><text x="60" y="587" font-size="11.5" fill="#1d1d1b">• Alertas embebidas como arreglo en el documento</text><text x="60" y="606" font-size="11.5" fill="#1d1d1b">• Índices: {paciente_id, ts} y {alertas.nivel, ts}</text><text x="60" y="625" font-size="11.5" fill="#1d1d1b">• Escala horizontal: shard key {paciente_id, ts}</text><text x="60" y="644" font-size="11.5" fill="#1d1d1b">• Retención automática (TTL 2 años) en time series</text><text x="60" y="663" font-size="11.5" fill="#1d1d1b">• NO guarda nombre, cédula ni EPS del paciente</text><rect x="640" y="390" width="520" height="330" rx="12" fill="#fdf3ee" stroke="#eb6834" stroke-width="2.5"/><text x="660" y="418" font-size="15" font-weight="700" fill="#1d1d1b">PostgreSQL 18 · capa ACID</text><text x="660" y="436" font-size="11.5" fill="#52514e">BD hce_core_grupo_6, esquema core · CP en CAP · consistencia fuerte</text><text x="660" y="464" font-size="11.5" fill="#1d1d1b"><tspan font-weight='700'>pacientes</tspan> · medicos · servicios · <tspan font-weight='700'>camas</tspan></text><text x="660" y="481" font-size="11.5" fill="#1d1d1b"><tspan font-weight='700'>hospitalizaciones</tspan> · diagnosticos_hospitalizacion</text><text x="660" y="498" font-size="11.5" fill="#1d1d1b"><tspan font-weight='700'>dispositivos</tspan> · <tspan font-weight='700'>asignaciones_dispositivo</tspan></text><text x="660" y="530" font-size="11.5" fill="#1d1d1b">• PK, FK, UNIQUE (cédula, registro médico), CHECK</text><text x="660" y="549" font-size="11.5" fill="#1d1d1b">• Índices únicos parciales: 1 hospitalización activa</text><text x="660" y="568" font-size="11.5" fill="#1d1d1b">  por paciente y por cama</text><text x="660" y="587" font-size="11.5" fill="#1d1d1b">• SELECT ... FOR UPDATE sobre la cama (sin doble asignación)</text><text x="660" y="606" font-size="11.5" fill="#1d1d1b">• Vista core.v_contexto_paciente para la integración</text><text x="660" y="625" font-size="11.5" fill="#1d1d1b">• Fuente única de verdad de la identidad</text><text x="660" y="644" font-size="11.5" fill="#1d1d1b">• Escala vertical + réplicas de lectura</text><path d="M562,600 L638,600" stroke="#3a3a37" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#punta)" marker-start="url(#punta)"/><text x="600" y="585" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1d1d1b">paciente_id</text><text x="600" y="622" text-anchor="middle" font-size="10.5" fill="#52514e">referencia</text><text x="600" y="636" text-anchor="middle" font-size="10.5" fill="#52514e">lógica (sin FK)</text><text x="600" y="755" text-anchor="middle" font-size="12" fill="#52514e">Flujo de escritura: ① valida en ACID → ② escribe en BASE. Flujo de lectura: ③ consulta BASE → ④ enriquece con ACID. Flujo transaccional: ⑤ solo ACID.</text><text x="600" y="775" text-anchor="middle" font-size="12" fill="#52514e">Verde = MongoDB (volumen, flexibilidad, disponibilidad) · Naranja = PostgreSQL (identidad, integridad, transacciones)</text></svg>